services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open3dcalc
      POSTGRES_USER: open3dcalc
      POSTGRES_PASSWORD: open3dcalc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open3dcalc"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    command: sh -c "npm run db:migrate"
    environment:
      DATABASE_URL: postgresql://open3dcalc:open3dcalc@db:5432/open3dcalc
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "3003:80"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: